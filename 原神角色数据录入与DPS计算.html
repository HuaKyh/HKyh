<style>

@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

*{box-sizing:border-box;margin:0;padding:0;font-family:"ZCOOL KuaiLe","Microsoft YaHei","PingFang SC",sans-serif}

body{min-height:100vh;padding:20px;background:linear-gradient(135deg,#ffd6e8 0%,#e8d5f5 35%,#c5e8ff 70%,#d4f5e8 100%);background-attachment:fixed;background-size:cover;transition:background .5s}

.lang-bar{text-align:center;margin-bottom:16px}

.lang-bar select{padding:6px 14px;border-radius:20px;border:2px solid rgba(232,121,168,.3);background:rgba(255,255,255,.9);color:#d4648e;font-size:14px;cursor:pointer;outline:none}

.card{position:relative;background:rgba(255,255,255,.82);border-radius:20px;padding:18px 20px;margin-bottom:16px;box-shadow:0 8px 32px rgba(232,121,168,.15),0 2px 8px rgba(186,155,220,.1);border:2px solid rgba(255,192,203,.4);backdrop-filter:blur(10px);z-index:1}

button:active{transform:translateY(0)}

button.pink{background:linear-gradient(135deg,#ff9eb5,#ff6b9d)}

button.purple{background:linear-gradient(135deg,#c9a0dc,#9b7ec4)}

button.blue{background:linear-gradient(135deg,#87cefa,#5fb4e8)}

button.green{background:linear-gradient(135deg,#98e8a8,#6bcb7e)}

button.red{background:linear-gradient(135deg,#ff9999,#ff6b6b)}

button.gray{background:linear-gradient(135deg,#c8c8d4,#a0a0b0)}

input:focus,select:focus{border-color:#e879a8;box-shadow:0 0 0 3px rgba(232,121,168,.15)}

input::placeholder{color:#c4a8b8}

select option{background:#fff;color:#5a4a5a}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:2px}

.mt{margin-top:10px}

.search-select{position:relative;display:inline-block;margin:3px}

.search-select input{width:175px;margin:0}

.search-select .dropdown{display:none;position:absolute;top:100%;left:0;z-index:200;background:rgba(255,255,255,.97);border:2px solid #f4a5c0;border-radius:14px;max-height:300px;overflow-y:auto;width:250px;box-shadow:0 8px 24px rgba(232,121,168,.2)}

.search-select .dropdown.open{display:block}

.search-select .dropdown .dd-item{padding:8px 14px;cursor:pointer;font-size:14px;color:#5a4a5a;border-bottom:1px solid rgba(232,121,168,.1);transition:background .15s}

.search-select .dropdown .dd-item:hover{background:rgba(255,182,193,.25)}

.search-select .dropdown .dd-group{padding:6px 14px;font-size:12px;color:#c97ba0;font-weight:bold;background:linear-gradient(90deg,rgba(255,182,193,.3),rgba(201,160,220,.2));position:sticky;top:0}

.star5{color:#e8a832;font-weight:bold}

.star4{color:#9b7ec4;font-weight:bold}

.star3{color:#5fb4e8;font-weight:bold}

.role-item{margin:10px 0;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,rgba(255,230,240,.8),rgba(240,230,255,.8));border:2px solid rgba(232,121,168,.25)}

.role-header{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:#5a4a5a;user-select:none;background:rgba(255,255,255,.5);transition:background .2s}

.role-header:hover{background:rgba(255,255,255,.8)}

.role-header .arrow{color:#e879a8;font-size:13px}

.role-body{padding:8px 16px 14px;display:none}

.role-body.open{display:block}

.role-meta{font-size:14px;color:#a87890;padding:8px 0}

.role-meta b{color:#d4648e}

.sub-block{margin:10px 0 4px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.6);border:1px solid rgba(232,121,168,.2)}

.sub-header{padding:10px 14px;cursor:pointer;font-size:14px;font-weight:bold;color:#d4648e;background:rgba(255,255,255,.5);display:flex;justify-content:space-between;align-items:center;user-select:none}

.sub-header:hover{background:rgba(255,255,255,.8)}

.sub-body{padding:10px 14px;display:none;font-size:14px;line-height:2;color:#7a6a7a}

.sub-body.open{display:block}

.sub-body b{color:#d4648e}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}

.role-actions{margin-top:10px;padding-top:8px;border-top:1px dashed rgba(232,121,168,.25)}

.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(232,121,168,.3);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:999}

.modal-content{padding:24px;border-radius:24px;width:700px;max-width:94vw;max-height:88vh;overflow-y:auto;background:rgba(255,255,255,.95);box-shadow:0 20px 60px rgba(232,121,168,.3);border:3px solid rgba(232,121,168,.3)}

.modal-content h3{color:#d4648e;font-size:20px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px dashed rgba(232,121,168,.3)}

.empty-tip{color:#c4a8b8;text-align:center;padding:30px 0;font-size:15px}

.stat-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}

.stat-chip{background:linear-gradient(135deg,rgba(255,182,193,.4),rgba(201,160,220,.3));border:1px solid rgba(232,121,168,.3);color:#d4648e;padding:6px 14px;border-radius:20px;font-size:13px}

.bg-settings-btn{position:fixed;top:16px;right:16px;z-index:500;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,rgba(255,182,193,.6),rgba(201,160,220,.6));border:2px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;opacity:.35;transition:all .3s;box-shadow:0 4px 12px rgba(232,121,168,.2)}

.bg-settings-btn:hover{opacity:1;transform:scale(1.1) rotate(15deg)}

.bg-panel{position:fixed;top:70px;right:16px;z-index:500;background:rgba(255,255,255,.95);border-radius:18px;padding:16px;border:2px solid rgba(232,121,168,.3);box-shadow:0 8px 30px rgba(232,121,168,.25);display:none;width:260px}

.bg-panel.open{display:block;animation:slideDown .3s ease}

@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

.bg-panel h4{color:#d4648e;font-size:15px;margin-bottom:10px}

.bg-presets{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}

.bg-preset{height:36px;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:all .2s}

.bg-preset:hover{transform:scale(1.05);border-color:#e879a8}

<body>

<div class="bg-settings-btn" onclick="toggleBgPanel()" title="背景设置">🎨</div>

<div class="bg-panel" id="bgPanel">

  <h4 data-i18n="bg_set">✿ 背景设置</h4>

  <div class="bg-presets">

    <div class="bg-preset" style="background:linear-gradient(135deg,#ffd6e8,#e8d5f5,#c5e8ff)" onclick="setPresetBg(0)" title="粉紫蓝"></div>

    <div class="bg-preset" style="background:linear-gradient(135deg,#ffe4b5,#ffb6c1,#dda0dd)" onclick="setPresetBg(1)" title="暖粉橙"></div>

    <div class="bg-preset" style="background:linear-gradient(135deg,#b0e0e6,#e6e6fa,#ffc0cb)" onclick="setPresetBg(2)" title="清透蓝紫"></div>

    <div class="bg-preset" style="background:linear-gradient(135deg,#98fb98,#90ee90,#00ced1)" onclick="setPresetBg(3)" title="清新绿"></div>

    <div class="bg-preset" style="background:linear-gradient(135deg,#2c2c54,#40407a,#706fd3)" onclick="setPresetBg(4)" title="暗夜紫"></div>

    <div class="bg-preset" style="background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)" onclick="setPresetBg(5)" title="深邃蓝"></div>

  </div>

  <button class="pink" style="width:100%;margin:4px 0" onclick="document.getElementById('bgFileInput2').click()" data-i18n="upload_bg">📁 上传本地图片</button>

  <button class="gray" style="width:100%;margin:4px 0" onclick="resetBg()" data-i18n="reset_bg">🔄 恢复默认</button>

  <input type="file" id="bgFileInput2" accept="image/*" style="display:none">

</div>

<h1 data-i18n="title">✿ 原神角色练度统计 ✿ V7.1</h1>

<div class="lang-bar">

  <select id="langSelect" onchange="setLang(this.value)">

    <option value="zh">简体中文</option>

    <option value="en">English</option>

    <option value="ja">日本語</option>

    <option value="fr">Français</option>

    <option value="es">Español</option>

    <option value="ru">Русский</option>

    <option value="ar">العربية</option>

    <option value="de">Deutsch</option>

    <option value="ko">한국어</option>

    <option value="pt">Português</option>

    <option value="it">Italiano</option>

    <option value="th">ไทย</option>

    <option value="vi">Tiếng Việt</option>

  </select>

</div>

<div class="card">

  <h3 data-i18n="acc_mgr">账号管理</h3>

  <div class="row">

    <input id="accName" data-i18n-ph="acc_name_ph">

    <button class="pink" onclick="addAccount()" data-i18n="add_acc">新增账号</button>

    <select id="accSelect" onchange="onAccChange()"></select>

    <button class="red" onclick="delAccount()" data-i18n="del_acc">删除当前账号</button>

  </div>

</div>

<div class="card">

  <h3 data-i18n="quick_add">快速新增角色（从库中搜索选择）</h3>

  <div class="row">

    <div class="search-select"><input id="rName" autocomplete="off" data-i18n-ph="search_role_ph" onfocus="openDD('charDD')" oninput="filterDD('charDD',this.value)"><div class="dropdown" id="charDD"></div></div>

    <select id="rStar"><option value="">星级</option><option value="5">5★</option><option value="4">4★</option></select>

    <select id="rEle"><option value="">元素</option><option value="火">火</option><option value="水">水</option><option value="冰">冰</option><option value="雷">雷</option><option value="风">风</option><option value="岩">岩</option><option value="草">草</option></select>

    <input id="rCon" placeholder="命座" type="number" min="0" max="6" style="width:75px">

    <input id="rLv" placeholder="角色等级" type="number" min="1" max="90" style="width:95px">

  </div>

  <div class="row mt">

    <select id="wType" onchange="updateWeaponDD()"><option value="">武器类型</option><option value="单手剑">单手剑</option><option value="双手剑">双手剑</option><option value="长柄武器">长柄武器</option><option value="法器">法器</option><option value="弓">弓</option></select>

    <div class="search-select"><input id="wName" autocomplete="off" data-i18n-ph="search_weapon_ph" onfocus="openDD('weaponDD')" oninput="filterDD('weaponDD',this.value)"><div class="dropdown" id="weaponDD"></div></div>

    <input id="wLv" placeholder="武器等级" type="number" min="1" max="90" style="width:95px">

    <input id="wRef" placeholder="精炼" type="number" min="1" max="5" style="width:75px">

    <input id="wNote" placeholder="备注（可选）" style="width:130px">

  </div>

  <div class="row mt">

    <input id="t1" placeholder="普攻天赋" type="number" min="1" max="10" style="width:95px">

    <input id="t2" placeholder="E天赋" type="number" min="1" max="10" style="width:85px">

    <input id="t3" placeholder="Q天赋" type="number" min="1" max="10" style="width:85px">

    <div class="search-select"><input id="artSet" autocomplete="off" data-i18n-ph="search_art_ph" onfocus="openDD('artDD')" oninput="filterDD('artDD',this.value)"><div class="dropdown" id="artDD"></div></div>

  </div>

  <div class="row mt">

    <input id="sAtk" placeholder="攻击力" style="width:105px">

    <input id="sDef" placeholder="防御力" style="width:105px">

    <input id="sEm" placeholder="元素精通" style="width:105px">

    <input id="sCr" placeholder="暴击率%" style="width:105px">

    <input id="sCd" placeholder="暴击伤害%" style="width:105px">

  </div>

  <div class="row mt">

    <input id="sEr" placeholder="元素充能效率%" style="width:125px">

    <input id="sDmg" placeholder="元素伤害加成%" style="width:125px">

    <input id="sHp" placeholder="生命值" style="width:105px">

  </div>

  <div class="mt"><button class="green" onclick="saveRole()" data-i18n="save_role">保存角色 ✿</button></div>

</div>

<div class="card">

  <h3 data-i18n="csv_title">CSV 导入导出</h3>

  <div class="row">

    <input type="file" id="fileInput" accept=".csv" style="display:none">

    <button class="blue" onclick="document.getElementById('fileInput').click()" data-i18n="import_csv">导入CSV</button>

    <button class="blue" onclick="exportCsv()" data-i18n="export_csv">导出全部账号CSV</button>

  </div>

  <div class="row mt">

    <input id="enkaUid" placeholder="输入原神UID（9位数字）" style="width:200px">

    <button id="enkaBtn" class="purple" onclick="fetchEnka()">从Enka拉取角色 ✿</button>

    <span style="font-size:12px;color:#a87890;margin-left:8px">需联网，角色需放入游戏展示柜</span>

  </div>

</div>

<div class="card">

  <h3><span data-i18n="role_list">角色列表（点击展开 → 武器 + 圣遗物子栏）</span>

    <button class="purple" style="float:right;font-size:13px;padding:6px 14px" onclick="toggleAllRole()" data-i18n="expand_all">全部展开/收起</button>

  </h3>

  <div class="stat-bar" id="statBar"></div>

  <div id="roleListWrap"><div class="empty-tip" data-i18n="no_role">暂无角色，请先在上方录入或导入CSV ✿</div></div>

</div>

<div class="modal" id="editModal">

  <div class="modal-content">

    <h3 data-i18n="edit_role">✿ 编辑角色</h3>

    <div class="row">

      <div class="search-select"><input id="edit_rName" autocomplete="off" data-i18n-ph="search_role_ph" onfocus="openDD('edit_charDD')" oninput="filterDD('edit_charDD',this.value)"><div class="dropdown" id="edit_charDD"></div></div>

      <select id="edit_rStar"><option value="5">5★</option><option value="4">4★</option></select>

    </div>

    <div class="row mt">

      <select id="edit_wType" onchange="updateEditWeaponDD()"><option value="">武器类型</option><option value="单手剑">单手剑</option><option value="双手剑">双手剑</option><option value="长柄武器">长柄武器</option><option value="法器">法器</option><option value="弓">弓</option></select>

      <div class="search-select"><input id="edit_wName" autocomplete="off" data-i18n-ph="search_weapon_ph" onfocus="openDD('edit_weaponDD')" oninput="filterDD('edit_weaponDD',this.value)"><div class="dropdown" id="edit_weaponDD"></div></div>

      <input id="edit_wLv" placeholder="武器等级" type="number" min="1" max="90" style="width:85px"><input id="edit_wRef" placeholder="精炼" type="number" min="1" max="5" style="width:75px"><input id="edit_wNote" placeholder="备注" style="width:110px">

    <div class="row mt">

      <input id="edit_t1" placeholder="普攻" type="number" min="1" max="10" style="width:75px"><input id="edit_t2" placeholder="E" type="number" min="1" max="10" style="width:65px"><input id="edit_t3" placeholder="Q" type="number" min="1" max="10" style="width:65px">

    </div>

    <div class="row mt">

      <input id="edit_sAtk" placeholder="攻击力" style="width:105px">

      <input id="edit_sDef" placeholder="防御力" style="width:105px">

      <input id="edit_sEm" placeholder="元素精通" style="width:105px">

      <input id="edit_sCr" placeholder="暴击率%" style="width:105px">

      <input id="edit_sCd" placeholder="暴击伤害%" style="width:105px">

    </div>

    <div class="row mt">

      <input id="edit_sEr" placeholder="元素充能效率%" style="width:125px">

      <input id="edit_sDmg" placeholder="元素伤害加成%" style="width:125px">

      <input id="edit_sHp" placeholder="生命值" style="width:105px">

    </div>

    <div class="mt"><button class="green" onclick="submitEdit()" data-i18n="confirm_edit">确认修改 ✿</button><button class="gray" onclick="closeModal()" data-i18n="cancel">取消</button></div>

  </div>

</div>

const ENKA_WTYPE={"WEAPON_SWORD_ONE_HAND":"单手剑","WEAPON_CLAYMORE":"双手剑","WEAPON_POLE":"长柄武器","WEAPON_CATALYST":"法器","WEAPON_BOW":"弓"};
const ELEM_DMG={"火":"2044","雷":"2045","水":"2046","草":"2047","风":"2048","岩":"2049","冰":"2050"};
async function fetchEnka(){
  if(!cur){toast(t("msg_please_acc"));return}
  const uid=document.getElementById("enkaUid").value.trim();
  if(!/^\d{9}$/.test(uid)){toast("请输入9位数字UID");return}
  const btn=document.getElementById("enkaBtn");btn.disabled=true;btn.textContent="拉取中...";
  try{
    const res=await fetch("https://enka.network/api/uid/"+uid);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    if(!data.avatarInfoList||!data.avatarInfoList.length){toast("未读到角色，请确认游戏内已放入角色展示柜");return}
    let cnt=0;
    data.avatarInfoList.forEach(av=>{
      const name=AVATAR_ID_MAP[av.avatarId]||("未知角色("+av.avatarId+")");
      const ci=C.find(c=>c.n===name);
      const star=ci?String(ci.s):"5";
      const ele=ci?E[ci.e]:"-";
      const cons=(av.talentIdList||[]).length;
      const level=parseInt(av.propMap&&av.propMap["1002"]&&av.propMap["1002"].val)||1;
      const wq=(av.equipList||[]).find(e=>e.flat&&e.flat.itemType==="ITEM_WEAPON");
      const wlv=wq&&wq.weapon?wq.weapon.level:1;
      const refine=wq&&wq.weapon&&wq.weapon.affixMap?Object.values(wq.weapon.affixMap)[0]:1;
      const wtype=wq&&wq.flat?ENKA_WTYPE[wq.flat.weaponType]||"":"";
      const sk=Object.entries(av.skillLevelMap||{}).sort((a,b)=>parseInt(a[0])-parseInt(b[0]));
      const t1=sk[0]?sk[0][1]:1,t2=sk[1]?sk[1][1]:1,t3=sk[2]?sk[2][1]:1;
      const fp=av.fightPropMap||{};
      const sAtk=fp["3001"]?Math.round(fp["3001"]):"";
      const sDef=fp["3002"]?Math.round(fp["3002"]):"";
      const sHp=fp["3000"]?Math.round(fp["3000"]):"";
      const sEm=fp["2020"]?Math.round(fp["2020"]):"";
      const sCr=fp["2040"]>0?(fp["2040"]*100).toFixed(1):"";
      const sCd=fp["2041"]>0?(fp["2041"]*100).toFixed(1):"";
      const sEr=fp["2030"]>0?(fp["2030"]*100).toFixed(1):"";
      const dk=ELEM_DMG[ele];
      const sDmg=dk&&fp[dk]>0?(fp[dk]*100).toFixed(1):"";
      D.accounts[cur].push({name,star,ele,cons,level,wname:"",wtype,wlv,refine,wnote:"",t1,t2,t3,artSet:"",sAtk,sDef,sEm,sCr,sCd,sEr,sDmg,sHp});
      cnt++;
    });
    sd();renderList();
    toast("成功拉取 "+cnt+" 个角色 ✿");
  }catch(err){
    console.error(err);
    toast("拉取失败："+(err.message||"网络错误")+"，请稍后重试");
  }finally{
    btn.disabled=false;btn.textContent="从Enka拉取角色 ✿";
  }
}

</script>
